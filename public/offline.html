<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=auto">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#00995B">
    <title>You're offline · Will Do It</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; background: #eeeeef; color: #18181b; }
      body { min-height: 100dvh; margin: 0; display: grid; place-items: center; }
      main { max-width: 24rem; padding: 2rem; text-align: center; }
      h1 { font-size: 1.5rem; font-weight: 600; }
      p { line-height: 1.6; color: #52525b; }
      a { display: inline-block; margin-top: 1rem; padding: .75rem 1.25rem; border-radius: .5rem; background: #2563eb; color: white; text-decoration: none; }
      a:focus-visible { outline: 3px solid #00995b; outline-offset: 4px; }
      @media (prefers-color-scheme: dark) { :root { background: #17171a; color: #ededed; } p { color: #a1a1aa; } }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>Connect to the internet to open your Will Do It workspace. Your saved cards will be there when you reconnect.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
