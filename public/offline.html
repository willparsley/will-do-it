<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#00995B">
    <script>
      if (/Android/i.test(navigator.userAgent) && matchMedia('(display-mode: standalone)').matches) {
        document.documentElement.setAttribute('data-android-pwa', '');
        document.querySelector('meta[name="viewport"]').content += ', viewport-fit=cover';
      }
    </script>
    <title>You're offline · Will Do It</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; background: #eeeeef; color: #18181b; }
      body { min-height: 100dvh; margin: 0; display: grid; place-items: center; }
      main { max-width: 24rem; padding: 2rem; text-align: center; }
      h1 { font-size: 1.5rem; font-weight: 600; }
      p { line-height: 1.6; color: #52525b; }
      a { display: inline-block; margin-top: 1rem; padding: .75rem 1.25rem; border-radius: .5rem; background: #2563eb; color: white; text-decoration: none; }
      a:focus-visible { outline: 3px solid #00995b; outline-offset: 4px; }
      html[data-android-pwa] { --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-max-inset-bottom, env(safe-area-inset-bottom, 0px)); background: #00995B; }
      html[data-android-pwa] body { box-sizing: border-box; border-top: var(--safe-top) solid #00995B; border-bottom: var(--safe-bottom) solid #00995B; padding-inline: env(safe-area-inset-left, 0px) env(safe-area-inset-right, 0px); background: #eeeeef; }
      html[data-android-pwa] body::after { content: ''; position: fixed; left: 0; right: 0; height: var(--safe-bottom); bottom: calc(env(safe-area-inset-bottom, 0px) - var(--safe-bottom)); background: #00995B; pointer-events: none; }
      @media (prefers-color-scheme: dark) { :root { background: #17171a; color: #ededed; } p { color: #a1a1aa; } }
      @media (prefers-color-scheme: dark) { html[data-android-pwa] body { background: #17171a; } }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>Connect to the internet to open your Will Do It workspace. Your saved cards will be there when you reconnect.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
